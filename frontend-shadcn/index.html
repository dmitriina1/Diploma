<!doctype html>
<html lang="ru" class="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0f" />
    <title>InterviewHub — подготовка к IT-собеседованиям</title>
    <meta name="description" content="Платформа подготовки к IT-собеседованиям с автоматическим извлечением вопросов из видео." />
    <script>
      // Инициализация темы до рендера для исключения мерцания
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'dark';
          var sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var resolved = t === 'system' ? sys : t;
          var html = document.documentElement;
          html.classList.remove('light', 'dark');
          html.classList.add(resolved);
          html.style.colorScheme = resolved;
          html.setAttribute('data-theme', resolved);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
