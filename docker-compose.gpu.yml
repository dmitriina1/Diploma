# =============================================================
# Docker Compose — NVIDIA GPU
# =============================================================
# Использование:
#   docker-compose -f docker-compose.gpu.yml up -d --build
#
# Требования:
#   - NVIDIA GPU с CUDA ≥ 12.0
#   - nvidia-docker2 или NVIDIA Container Toolkit
#   - Минимум 6GB VRAM
#
# Whisper: faster-whisper + CUDA + float16 + large-v3
# Ожидаемая скорость:
#   - RTX 3060: 30 мин видео → ~2-3 мин
#   - RTX 3080: 30 мин видео → ~1.5-2 мин
#   - RTX 4090: 30 мин видео → ~1 мин
# =============================================================

services:
  # ============== PostgreSQL ==============
  postgres:
    image: postgres:15-alpine
    container_name: diploma-postgres
    environment:
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma123
      POSTGRES_DB: interview_prep
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma -d interview_prep"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diploma-network

  # ============== Redis ==============
  redis:
    image: redis:7-alpine
    container_name: diploma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diploma-network

  # ============== Whisper Worker (NVIDIA GPU) ==============
  whisper-worker:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile.gpu
    container_name: diploma-whisper-gpu
    environment:
      - WHISPER_MODEL=large-v3
      - DEVICE=cuda
      - COMPUTE_TYPE=float16
      - BEAM_SIZE=5
      - VAD_ENABLED=true
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
    volumes:
      - whisper_cache:/root/.cache/whisper
      - shared_temp:/app/temp
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
    networks:
      - diploma-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ============== Backend (FastAPI) ==============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diploma-backend
    environment:
      - DATABASE_URL=postgresql://diploma:diploma123@postgres:5432/interview_prep
      - REDIS_URL=redis://redis:6379
      - WHISPER_BASE_URL=http://whisper-worker:8000
      - MAX_WHISPER_WORKERS=1
      - WORKER_IDLE_TIMEOUT=600
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3010,http://localhost:3020}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - shared_temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diploma-network
    command: ["uvicorn", "main_new:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ============== Frontend (Vue.js) ==============
  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.dev
    container_name: diploma-frontend-vue
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - diploma-network

  # ============== Frontend PrimeVue (Dedicated Variant) ==============
  primevue:
    build:
      context: ./PrimeVue
      dockerfile: Dockerfile
    container_name: PrimeVue
    ports:
      - "3020:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - diploma-network

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
  shared_temp:

networks:
  diploma-network:
    driver: bridge
