services:
  # ============== PostgreSQL ==============
  postgres:
    image: postgres:15-alpine
    container_name: diploma-postgres
    environment:
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma123
      POSTGRES_DB: interview_prep
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma -d interview_prep"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diploma-network

  # ============== Redis ==============
  redis:
    image: redis:7-alpine
    container_name: diploma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diploma-network

  # ============== Whisper Worker (Per-Task Scaling) ==============
  whisper-worker:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    container_name: diploma-whisper-worker
    environment:
      - WHISPER_MODEL=large-v3
      - CPU_THREADS=10
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
    volumes:
      - whisper_cache:/root/.cache/whisper
      - shared_temp:/app/temp
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - diploma-network
    deploy:
      resources:
        limits:
          memory: 14G
        reservations:
          memory: 10G

  # ============== Backend (FastAPI) ==============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diploma-backend
    environment:
      - DATABASE_URL=postgresql://diploma:diploma123@postgres:5432/interview_prep
      - REDIS_URL=redis://redis:6379
      - WHISPER_BASE_URL=http://whisper-worker:8000
      - MAX_WHISPER_WORKERS=2
      - WORKER_IDLE_TIMEOUT=600
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - shared_temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diploma-network
    command: ["uvicorn", "main_new:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ============== Frontend (Vue.js) ==============
  frontend:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.dev
    container_name: diploma-frontend-vue
    environment:
      - VITE_API_BASE_URL=/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - diploma-network

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
  shared_temp:

networks:
  diploma-network:
    driver: bridge
