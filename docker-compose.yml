services:
  # ============== PostgreSQL ==============
  postgres:
    image: postgres:15-alpine
    container_name: diploma-postgres
    environment:
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma123
      POSTGRES_DB: interview_prep
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma -d interview_prep"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diploma-network

  # ============== Redis ==============
  redis:
    image: redis:7-alpine
    container_name: diploma-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - diploma-network

  # ============== Whisper Worker (Auto-detect CPU/GPU) ==============
  whisper-worker:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile.cpu
    container_name: diploma-whisper-worker
    environment:
      - WHISPER_MODEL=large-v3-turbo
      - DEVICE=auto
      - COMPUTE_TYPE=auto
      - CPU_THREADS=10
      - BEAM_SIZE=3
      - VAD_ENABLED=true
      - HF_HUB_ENABLE_HF_TRANSFER=0
      - HF_HUB_DISABLE_XET=1
      - HF_HUB_DOWNLOAD_TIMEOUT=1800
    volumes:
      - whisper_cache:/root/.cache/whisper
      - shared_temp:/app/temp
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - diploma-network
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # ============== Backend (FastAPI) ==============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diploma-backend
    environment:
      - DATABASE_URL=postgresql://diploma:diploma123@postgres:5432/interview_prep
      - REDIS_URL=redis://redis:6379
      - WHISPER_BASE_URL=http://whisper-worker:8000
      - MAX_WHISPER_WORKERS=2
      - WORKER_IDLE_TIMEOUT=600
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-auto}
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-local-jwt-secret-change-me-2026}
      - ENABLE_DEFAULT_ADMIN=${ENABLE_DEFAULT_ADMIN:-true}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-admin123}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3010}
      - AUTO_MIGRATE_DB=${AUTO_MIGRATE_DB:-true}
      - DB_POOL_MIN_SIZE=${DB_POOL_MIN_SIZE:-2}
      - DB_POOL_MAX_SIZE=${DB_POOL_MAX_SIZE:-20}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - shared_temp:/app/temp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - diploma-network
    command: ["uvicorn", "main_new:app", "--host", "0.0.0.0", "--port", "8000"]

  # ============== Frontend NEW (Vue.js — New Design) ==============
  frontend:
    build:
      context: ./frontend-new
      dockerfile: Dockerfile.dev
    container_name: diploma-frontend-new
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-new:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - diploma-network

  # ============== Frontend OLD (Vue.js + PrimeVue — legacy) ==============
  frontend-old:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.dev
    container_name: diploma-frontend-old
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_WS_PROXY_TARGET=ws://backend:8000
    ports:
      - "3001:3000"
    volumes:
      - ./frontend-vue:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - diploma-network

  # ============== Frontend V2 (Vuetify Design System) ==============
  frontend-v2:
    build:
      context: ./frontend-new-v2
      dockerfile: Dockerfile.dev
    container_name: diploma-frontend-v2
    environment:
      - VITE_API_BASE_URL=/api
      - VITE_PROXY_TARGET=http://backend:8000
    ports:
      - "3010:3010"
    volumes:
      - ./frontend-new-v2:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - diploma-network

volumes:
  postgres_data:
  redis_data:
  whisper_cache:
  shared_temp:

networks:
  diploma-network:
    driver: bridge
