<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Проверка отображения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            text-align: center;
        }
        .box {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 600px;
        }
        p {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 1rem;
        }
        .button {
            background: white;
            color: #667eea;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>🎉 Если вы видите этот текст - браузер работает!</h1>
    
    <div class="box">
        <p><strong>✅ Проверка 1:</strong> Цвета и градиенты отображаются</p>
        <p><strong>✅ Проверка 2:</strong> Текст читается</p>
        <p><strong>✅ Проверка 3:</strong> Размеры правильные</p>
        
        <button class="button" onclick="alert('Кнопки работают!')">Нажми меня</button>
    </div>
    
    <p style="margin-top: 2rem; opacity: 0.8;">
        Теперь вернитесь на <a href="/" style="color: yellow; text-decoration: underline;">главную страницу</a> 
        и проверьте консоль (F12)
    </p>
</body>
</html>
