# =============================================================================
# Nginx Load Balancer для Whisper Service Pool
# =============================================================================
# Распределяет нагрузку между несколькими Whisper инстансами
# Масштабирование: docker-compose up -d --scale whisper=N
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Логирование
    log_format upstream_log '[$time_local] $remote_addr -> $upstream_addr '
                           '$request_method $uri '
                           'status=$status time=$request_time';
    
    access_log /var/log/nginx/access.log upstream_log;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # Upstream: Пул Whisper инстансов
    # ==========================================================================
    # Docker Compose автоматически резолвит "whisper" в IP всех реплик
    # least_conn — отправляет запрос на наименее загруженный инстанс
    # ==========================================================================
    upstream whisper_pool {
        least_conn;  # Балансировка по наименьшему числу соединений
        
        # Docker Compose DNS резолвит все реплики сервиса "whisper"
        server whisper:8000 max_fails=3 fail_timeout=30s;
        
        # Keepalive соединения для производительности
        keepalive 32;
    }

    server {
        listen 8001;
        server_name localhost;
        
        # Увеличенные таймауты для длинных транскрибаций (до 30 мин)
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;    # 30 минут
        proxy_read_timeout 1800s;    # 30 минут
        send_timeout 1800s;
        
        # Буферизация для больших аудиофайлов
        client_max_body_size 500M;   # Макс. размер файла
        client_body_buffer_size 10M;
        
        # Проксирование на Whisper Pool
        location / {
            proxy_pass http://whisper_pool;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            
            # Для multipart/form-data (загрузка файлов)
            proxy_request_buffering off;
        }
        
        # Health check endpoint
        location /health {
            proxy_pass http://whisper_pool/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # Статус nginx (для мониторинга)
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker network
            deny all;
        }
    }
}
